<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/offline.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
<script src="./image-slot.js"></script>
</helmet>
<div style="{{ rootStyle }}">

<div aria-hidden="true" style="position:absolute;inset:0">
<sc-if value="{{ sc.ja }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 380 240" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
<defs><linearGradient id="jaSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3566"></stop><stop offset=".55" stop-color="#C9849A"></stop><stop offset="1" stop-color="#F4C7A1"></stop></linearGradient></defs>
<rect width="380" height="240" fill="url(#jaSky)"></rect>
<circle cx="292" cy="78" r="22" fill="#FBE3C6" opacity=".9"></circle>
<path d="M40 176 L160 74 Q190 58 220 74 L340 176 Z" fill="#4A4F86"></path>
<path d="M160 74 Q190 58 220 74 L238 90 L222 86 L210 96 L196 86 L182 96 L170 86 L144 90 Z" fill="#F3F1F7"></path>
<path d="M0 182 Q60 160 120 176 T240 172 T380 168 L380 240 L0 240 Z" fill="#2B2F59"></path>
<rect x="0" y="198" width="380" height="42" fill="#1E2244"></rect>
<g fill="#C24A3A"><rect x="58" y="152" width="4" height="46"></rect><rect x="80" y="152" width="4" height="46"></rect><rect x="50" y="148" width="42" height="5" rx="1"></rect><rect x="54" y="159" width="34" height="3"></rect></g>
</svg>
</sc-if>
<sc-if value="{{ sc.zh }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 380 240" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
<defs><linearGradient id="zhSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDE7E2"></stop><stop offset="1" stop-color="#F3F1E8"></stop></linearGradient><linearGradient id="zhMist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F1E8" stop-opacity="0"></stop><stop offset="1" stop-color="#F3F1E8" stop-opacity=".9"></stop></linearGradient></defs>
<rect width="380" height="240" fill="url(#zhSky)"></rect>
<path d="M150 150 C150 80 175 40 190 40 C205 40 222 80 222 150 Z" fill="#A9C2B6"></path>
<path d="M250 150 C250 95 268 70 280 70 C294 70 306 100 306 150 Z" fill="#A9C2B6"></path>
<path d="M30 160 C34 100 58 62 76 62 C96 62 112 104 116 160 Z" fill="#7FA392"></path>
<path d="M200 165 C204 112 222 86 236 86 C252 86 264 120 266 165 Z" fill="#6F9483"></path>
<path d="M300 170 C304 118 326 92 342 92 C358 92 372 126 376 170 Z" fill="#5D8572"></path>
<rect x="0" y="120" width="380" height="60" fill="url(#zhMist)"></rect>
<path d="M0 178 Q100 168 190 176 T380 172 L380 240 L0 240 Z" fill="#3F6A5C"></path>
<path d="M0 196 L380 196 L380 240 L0 240 Z" fill="#2F5248"></path>
<path d="M96 192 L140 192 L132 199 L104 199 Z" fill="#1E3A32"></path><rect x="117" y="178" width="1.5" height="14" fill="#1E3A32"></rect>
</svg>
</sc-if>
<sc-if value="{{ sc.en }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 380 240" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
<defs><linearGradient id="enSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA6BF"></stop><stop offset="1" stop-color="#D9E1E6"></stop></linearGradient></defs>
<rect width="380" height="240" fill="url(#enSky)"></rect>
<ellipse cx="90" cy="60" rx="70" ry="16" fill="#EEF2F4" opacity=".7"></ellipse><ellipse cx="290" cy="44" rx="56" ry="12" fill="#EEF2F4" opacity=".6"></ellipse>
<path d="M0 150 Q90 112 190 140 T380 128 L380 240 L0 240 Z" fill="#8FAE7A"></path>
<path d="M0 172 Q120 138 240 162 T380 158 L380 240 L0 240 Z" fill="#6E9460"></path>
<path d="M0 196 Q140 170 380 190 L380 240 L0 240 Z" fill="#4F7446"></path>
<path d="M30 175 Q130 150 240 166" fill="none" stroke="#3D5C37" stroke-width="2"></path>
<path d="M150 190 Q260 168 380 176" fill="none" stroke="#2F4A2B" stroke-width="2"></path>
<g fill="#3D5C37"><circle cx="262" cy="150" r="10"></circle><circle cx="276" cy="146" r="12"></circle><rect x="268" y="150" width="3" height="14"></rect></g>
<g><rect x="320" y="134" width="22" height="16" fill="#E9E1D2"></rect><path d="M316 136 L331 124 L346 136 Z" fill="#6B4F3F"></path></g>
</svg>
</sc-if>
<sc-if value="{{ sc.ko }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 380 240" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
<defs><linearGradient id="koSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3D3"></stop><stop offset="1" stop-color="#FBF2EA"></stop></linearGradient></defs>
<rect width="380" height="240" fill="url(#koSky)"></rect>
<circle cx="96" cy="70" r="18" fill="#E87C5A" opacity=".85"></circle>
<path d="M0 120 L40 96 L80 112 L130 82 L180 108 L230 88 L290 112 L340 92 L380 104 L380 240 L0 240 Z" fill="#B9C3D6"></path>
<path d="M0 146 L50 122 L100 138 L160 112 L220 136 L280 116 L340 134 L380 124 L380 240 L0 240 Z" fill="#8A97B3"></path>
<path d="M0 172 L70 148 L130 164 L200 140 L270 162 L330 146 L380 156 L380 240 L0 240 Z" fill="#5D6A8C"></path>
<path d="M0 198 L80 180 L170 194 L250 176 L380 190 L380 240 L0 240 Z" fill="#39435F"></path>
<g fill="#262D42"><path d="M232 176 Q262 164 292 176 L286 178 L238 178 Z"></path><rect x="242" y="178" width="40" height="12"></rect></g>
</svg>
</sc-if>
</div>

<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotPh }}"></image-slot></div>
</sc-if>

<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom, rgba(10,12,24,.10) 0%, rgba(10,12,24,0) 30%, rgba(10,12,24,.35) 55%, rgba(10,12,24,.78) 100%)"></div>

<div style="position:relative;height:100%;box-sizing:border-box;padding:14px 12px 10px 20px;display:flex;flex-direction:column;pointer-events:none;color:#FFFFFF">
<div style="display:flex;align-items:center;gap:6px;font:500 12px/1.3 'Be Vietnam Pro',sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.35)"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:15px">location_on</span><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ place }}</span><span style="opacity:.85;padding-right:8px">{{ deck }}</span></div>
<div style="flex:1"></div>
<div role="button" tabindex="0" onClick="{{ next }}" style="pointer-events:auto;cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.35)">
<div lang="{{ lang }}" style="font:{{ wf }};letter-spacing:-0.01em">{{ w.w }}</div>
<div style="font:400 15px/1.4 'Noto Sans','Noto Sans JP','Noto Sans KR',sans-serif;opacity:.9;margin-top:2px">{{ w.pron }}</div>
<sc-if value="{{ isLarge }}" hint-placeholder-val="{{ false }}"><div lang="vi" style="font:500 18px/1.35 'Be Vietnam Pro',sans-serif;margin-top:6px">{{ w.mean }}</div></sc-if>
<sc-if value="{{ isMedium }}" hint-placeholder-val="{{ true }}"><div lang="vi" style="font:400 15px/1.35 'Be Vietnam Pro',sans-serif;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ w.mean }}</div></sc-if>
</div>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;pointer-events:auto">
<button onClick="{{ speak }}" aria-label="Play pronunciation" style="width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:22px">volume_up</span></button>
<button onClick="{{ next }}" aria-label="Next word" style="width:44px;height:44px;border:none;border-radius:50%;background:#FFFFFF;color:#1A1B21;display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:22px">arrow_forward</span></button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:400},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ja&quot;,&quot;zh&quot;,&quot;en&quot;,&quot;ko&quot;],&quot;default&quot;:&quot;ja&quot;,&quot;tsType&quot;:&quot;'ja'|'zh'|'en'|'ko'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;medium&quot;,&quot;large&quot;],&quot;default&quot;:&quot;medium&quot;,&quot;tsType&quot;:&quot;'medium'|'large'&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;startIdx&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const SCENES = {
  ja: { place: 'Fuji-san, Japan', deck: 'Japanese N5', tts: 'ja-JP', fam: "'Noto Sans JP',sans-serif", words: [
    { w: '山', pron: 'やま · yama', mean: 'núi' }, { w: '富士山', pron: 'ふじさん · Fujisan', mean: 'núi Phú Sĩ' }, { w: '夕焼け', pron: 'ゆうやけ · yūyake', mean: 'ráng chiều' }, { w: '鳥居', pron: 'とりい · torii', mean: 'cổng đền Thần đạo' } ] },
  zh: { place: 'Guilin, China', deck: 'Chinese HSK 3', tts: 'zh-CN', fam: "'Noto Sans SC',sans-serif", words: [
    { w: '山水', pron: 'shānshuǐ', mean: 'sơn thủy, phong cảnh' }, { w: '雾', pron: 'wù', mean: 'sương mù' }, { w: '河流', pron: 'héliú', mean: 'dòng sông' }, { w: '风景', pron: 'fēngjǐng', mean: 'phong cảnh' } ] },
  en: { place: 'The Cotswolds, England', deck: 'IELTS 3000', tts: 'en-GB', fam: "'Be Vietnam Pro',sans-serif", words: [
    { w: 'meadow', pron: '/ˈmedəʊ/', mean: 'đồng cỏ' }, { w: 'serene', pron: '/səˈriːn/', mean: 'thanh bình, tĩnh lặng' }, { w: 'hedgerow', pron: '/ˈhedʒrəʊ/', mean: 'hàng rào cây bụi' }, { w: 'drizzle', pron: '/ˈdrɪzl/', mean: 'mưa phùn' } ] },
  ko: { place: 'Seoraksan, Korea', deck: 'Korean Basics', tts: 'ko-KR', fam: "'Noto Sans KR',sans-serif", words: [
    { w: '산', pron: 'san', mean: 'núi' }, { w: '하늘', pron: 'haneul', mean: 'bầu trời' }, { w: '단풍', pron: 'danpung', mean: 'lá phong đỏ mùa thu' }, { w: '아침', pron: 'achim', mean: 'buổi sáng' } ] },
};
class Component extends DCLogic {
  state = { i: 0 };
  renderVals() {
    const p = this.props, L = SCENES[p.lang] ? p.lang : 'ja', S = SCENES[L], size = p.size === 'large' ? 'large' : 'medium';
    const w = S.words[((this.state.i + (p.startIdx || 0)) % S.words.length + S.words.length) % S.words.length];
    const n = [...w.w].length, cjk = L !== 'en';
    const px = size === 'large' ? (cjk ? (n <= 2 ? 64 : 48) : (n <= 8 ? 44 : 36)) : (cjk ? (n <= 2 ? 44 : 36) : (n <= 8 ? 32 : 28));
    return {
      rootStyle: { position: 'relative', width: '100%', maxWidth: '380px', height: size === 'large' ? '384px' : '184px', borderRadius: '28px', overflow: 'hidden', boxShadow: '0 2px 8px rgba(16,17,22,.16)', background: '#1A1B21', fontFamily: "'Be Vietnam Pro',sans-serif" },
      sc: { ja: L === 'ja', zh: L === 'zh', en: L === 'en', ko: L === 'ko' },
      hasPhoto: !!p.photo, slotId: `scene-${L}-${size}`, slotPh: `Drop a photo of ${S.place}`,
      place: S.place, deck: S.deck, lang: L, w, isLarge: size === 'large', isMedium: size !== 'large',
      wf: `${cjk ? 500 : 600} ${px}px/1.1 ${S.fam}`,
      next: e => { e && e.stopPropagation && e.stopPropagation(); this.setState(x => ({ i: x.i + 1 })); },
      speak: e => {
        e && e.stopPropagation && e.stopPropagation();
        if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w.w); u.lang = S.tts; speechSynthesis.speak(u);
      },
    };
  }
}
</script>
</body>
</html>
