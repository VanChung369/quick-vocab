<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/offline.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
</helmet>
<div style="{{ rootStyle }}">
<div style="display:flex;align-items:center;gap:8px;min-height:24px">
<span style="flex:1;min-width:0;font:500 12px/1.3 'Be Vietnam Pro',sans-serif;color:var(--on2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ deckName }}</span>
<sc-if value="{{ notSmall }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ toggleFav }}" aria-label="Favorite" style="width:36px;height:36px;margin:-6px -6px -6px 0;border:none;border-radius:50%;background:transparent;color:{{ favColor }};display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:20px;font-variation-settings:{{ favFill }}">star</span></button>
</sc-if>
</div>
<div role="button" tabindex="0" onClick="{{ open }}" style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:{{ justify }};cursor:pointer">
<div lang="{{ w.lang }}" style="font:{{ w.wf }};color:var(--on);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ w.w }}</div>
<sc-if value="{{ showPron }}" hint-placeholder-val="{{ true }}">
<div style="font:{{ prFont }};color:var(--on2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ w.pronLine }}</div>
</sc-if>
<sc-if value="{{ showMean }}" hint-placeholder-val="{{ true }}">
<div lang="vi" style="font:{{ meanFont }};color:var(--on);margin-top:{{ meanGap }};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ w.mean }}</div>
</sc-if>
<sc-if value="{{ showDef }}" hint-placeholder-val="{{ false }}">
<div style="font:400 14px/1.45 'Be Vietnam Pro',sans-serif;color:var(--on2);margin-top:4px">{{ w.def }}</div>
</sc-if>
<sc-if value="{{ showEx }}" hint-placeholder-val="{{ false }}">
<div lang="{{ w.lang }}" style="font:400 15px/1.5 {{ w.fam }};color:var(--on);margin-top:16px">{{ w.exPre }}<span style="font-weight:600;color:var(--p)">{{ w.exHit }}</span>{{ w.exPost }}</div>
<div lang="vi" style="font:400 13px/1.45 'Be Vietnam Pro',sans-serif;color:var(--on2);margin-top:2px">{{ w.exTr }}</div>
</sc-if>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px">
<sc-if value="{{ notSmall }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ prev }}" aria-label="Previous word" style="width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:var(--on2);display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:24px">chevron_left</span></button>
</sc-if>
<button onClick="{{ speak }}" aria-label="Play pronunciation" style="width:44px;height:44px;border:none;border-radius:50%;background:var(--c2);color:var(--on);display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:22px">volume_up</span></button>
<sc-if value="{{ notSmall }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ toggleLearned }}" aria-label="{{ learnedLabel }}" style="height:44px;padding:0 {{ learnedPad }};border:none;border-radius:22px;background:{{ learnedBg }};color:{{ learnedFg }};display:flex;align-items:center;gap:6px;cursor:pointer;font:500 14px/1 'Be Vietnam Pro',sans-serif"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:22px;font-variation-settings:{{ learnedFill }}">check_circle</span>{{ learnedText }}</button>
</sc-if>
<button onClick="{{ next }}" aria-label="Next word" style="width:44px;height:44px;border:none;border-radius:50%;background:var(--sc);color:var(--onsc);display:grid;place-items:center;cursor:pointer;padding:0"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:24px">arrow_forward</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:420},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;medium&quot;,&quot;large&quot;],&quot;default&quot;:&quot;medium&quot;,&quot;tsType&quot;:&quot;'small'|'medium'|'large'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;deck&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ielts&quot;,&quot;n5&quot;,&quot;hsk&quot;,&quot;personal&quot;],&quot;default&quot;:&quot;ielts&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pron&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mean&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ex&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fs&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:1.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;startIdx&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
const F = "'Be Vietnam Pro','Noto Sans',sans-serif";
const fam = l => l === 'ja' ? "'Noto Sans JP',sans-serif" : l === 'zh' ? "'Noto Sans SC',sans-serif" : F;
const DATA = {
  ielts: { name: 'IELTS 3000', lang: 'en', words: [
    { id: 'e1', w: 'meticulous', pron: '/məˈtɪkjələs/', mean: 'tỉ mỉ, kỹ lưỡng', def: 'very careful about small details', ex: 'She was meticulous in preparing the report.', exTr: 'Cô ấy chuẩn bị bản báo cáo rất tỉ mỉ.' },
    { id: 'e2', w: 'ubiquitous', pron: '/juːˈbɪkwɪtəs/', mean: 'có mặt ở khắp nơi', def: 'seeming to be everywhere at the same time', ex: 'Smartphones have become ubiquitous.', exTr: 'Điện thoại thông minh đã có mặt khắp nơi.' },
    { id: 'e3', w: 'ephemeral', pron: '/ɪˈfemərəl/', mean: 'ngắn ngủi, phù du', def: 'lasting for a very short time', ex: 'Fame on social media is often ephemeral.', exTr: 'Danh tiếng trên mạng xã hội thường ngắn ngủi.' },
    { id: 'e6', w: 'resilient', pron: '/rɪˈzɪliənt/', mean: 'kiên cường, mau phục hồi', def: 'able to recover quickly from difficulties', ex: 'Children are often remarkably resilient.', exTr: 'Trẻ em thường kiên cường đến bất ngờ.' },
  ] },
  n5: { name: 'Japanese N5', lang: 'ja', words: [
    { id: 'j1', w: '食べる', read: 'たべる', pron: 'taberu', mean: 'ăn', def: 'to eat', ex: '毎朝パンを食べます。', hl: '食べ', exTr: 'Sáng nào tôi cũng ăn bánh mì.' },
    { id: 'j5', w: '天気', read: 'てんき', pron: 'tenki', mean: 'thời tiết', def: 'weather', ex: '今日はいい天気ですね。', exTr: 'Hôm nay trời đẹp nhỉ.' },
    { id: 'j4', w: '水', read: 'みず', pron: 'mizu', mean: 'nước', def: 'water', ex: '水を一杯ください。', exTr: 'Cho tôi một cốc nước.' },
  ] },
  hsk: { name: 'Chinese HSK 3', lang: 'zh', words: [
    { id: 'c1', w: '学习', pron: 'xuéxí', mean: 'học tập', def: 'to study, to learn', ex: '我在学习中文。', exTr: 'Tôi đang học tiếng Trung.' },
    { id: 'c5', w: '解决', pron: 'jiějué', mean: 'giải quyết', def: 'to solve, to resolve', ex: '这个问题很难解决。', exTr: 'Vấn đề này rất khó giải quyết.' },
    { id: 'c3', w: '喜欢', pron: 'xǐhuan', mean: 'thích', def: 'to like', ex: '我喜欢喝茶。', exTr: 'Tôi thích uống trà.' },
  ] },
  personal: { name: 'Personal', lang: 'en', words: [
    { id: 'p1', w: 'serendipity', pron: '/ˌserənˈdɪpəti/', mean: 'sự tình cờ may mắn', def: 'finding good things by chance', ex: 'Meeting her was pure serendipity.', exTr: 'Gặp cô ấy là một sự tình cờ may mắn.' },
    { id: 'p2', w: 'make ends meet', pron: '/meɪk endz miːt/', mean: 'kiếm đủ sống', def: 'to have just enough money for what you need', ex: 'Many families struggle to make ends meet.', exTr: 'Nhiều gia đình chật vật để kiếm đủ sống.' },
  ] },
};
const T = {
  light: { '--bg': '#FFFFFF', '--c2': '#EDEDF2', '--on': '#1A1B21', '--on2': '#575A66', '--p': '#4851B5', '--sc': '#E2E4F3', '--onsc': '#252A4A', '--ok': '#2C7A4B', '--okc': '#D9F0E1', '--onokc': '#0D4426' },
  dark: { '--bg': '#1D1E24', '--c2': '#2A2B32', '--on': '#E4E4EB', '--on2': '#ABADBA', '--p': '#BAC0FF', '--sc': '#30334A', '--onsc': '#DDE0F7', '--ok': '#7FD19E', '--okc': '#1C3A28', '--onokc': '#B9EECB' },
};
class Component extends DCLogic {
  state = { i: 0, learned: {}, fav: {} };
  renderVals() {
    const p = this.props, s = this.state;
    const size = p.size || 'medium';
    const d = DATA[p.deck] || DATA.ielts;
    const list = d.words;
    const raw = list[((s.i + (p.startIdx || 0)) % list.length + list.length) % list.length];
    const L = d.lang, n = [...raw.w].length, fs = p.fs || 1;
    const sz = cjk(L) ? (size === 'small' ? (n <= 2 ? 40 : 30) : size === 'medium' ? (n <= 2 ? 44 : 36) : (n <= 2 ? 56 : 44))
      : size === 'small' ? (n <= 8 ? 26 : n <= 11 ? 22 : 19) : size === 'medium' ? (n <= 10 ? 30 : n <= 14 ? 26 : 22) : (n <= 10 ? 38 : n <= 14 ? 32 : 26);
    const hl = raw.hl || raw.w, hi = raw.ex.toLowerCase().indexOf(hl.toLowerCase());
    const w = {
      ...raw, lang: L, fam: fam(L), wf: `${cjk(L) ? 500 : 600} ${sz * fs}px/1.15 ${fam(L)}`,
      pronLine: L === 'ja' ? `${raw.read} · ${raw.pron}` : raw.pron,
      exPre: hi >= 0 ? raw.ex.slice(0, hi) : raw.ex, exHit: hi >= 0 ? raw.ex.substr(hi, hl.length) : '', exPost: hi >= 0 ? raw.ex.slice(hi + hl.length) : '',
    };
    const learned = !!s.learned[raw.id], fav = !!s.fav[raw.id];
    const theme = T[p.theme === 'dark' ? 'dark' : 'light'];
    const dims = size === 'small' ? { width: '176px', height: '176px', padding: '16px' } : size === 'medium' ? { width: '100%', maxWidth: '380px', height: '184px', padding: '14px 12px 10px 20px' } : { width: '100%', maxWidth: '380px', height: '384px', padding: '18px 14px 12px 22px' };
    const speak = e => {
      e && e.stopPropagation();
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(raw.w); u.lang = { en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' }[L]; speechSynthesis.speak(u);
    };
    return {
      rootStyle: { ...theme, ...dims, boxSizing: 'border-box', borderRadius: '28px', background: 'var(--bg)', display: 'flex', flexDirection: 'column', fontFamily: F, boxShadow: '0 2px 8px rgba(16,17,22,.12)', overflow: 'hidden' },
      deckName: d.name, w, notSmall: size !== 'small',
      justify: size === 'large' ? 'flex-start' : 'center',
      showPron: p.pron !== false, showMean: p.mean !== false && size !== 'small',
      showDef: size === 'large' && p.mean !== false && !p.ex, showEx: size === 'large' && !!p.ex,
      prFont: `400 ${(size === 'small' ? 13 : 15) * fs}px/1.4 'Noto Sans','Noto Sans JP',sans-serif`,
      meanFont: `${size === 'large' ? 500 : 400} ${(size === 'large' ? 20 : 16) * fs}px/1.35 ${F}`,
      meanGap: size === 'large' ? '12px' : '4px',
      favColor: fav ? 'var(--p)' : 'var(--on2)', favFill: fav ? "'FILL' 1" : "'FILL' 0",
      learnedBg: learned ? 'var(--okc)' : 'transparent', learnedFg: learned ? 'var(--onokc)' : 'var(--on2)', learnedFill: learned ? "'FILL' 1" : "'FILL' 0",
      learnedText: size === 'large' ? (learned ? 'Learned' : 'Mark learned') : '', learnedPad: size === 'large' ? '16px' : '10px',
      learnedLabel: learned ? 'Learned. Tap to undo' : 'Mark as learned',
      toggleFav: e => { e.stopPropagation(); this.setState(x => ({ fav: { ...x.fav, [raw.id]: !x.fav[raw.id] } })); },
      toggleLearned: e => { e.stopPropagation(); this.setState(x => ({ learned: { ...x.learned, [raw.id]: !x.learned[raw.id] } })); },
      next: e => { e.stopPropagation(); this.setState(x => ({ i: x.i + 1 })); },
      prev: e => { e.stopPropagation(); this.setState(x => ({ i: x.i - 1 })); },
      speak, open: () => p.onOpen && p.onOpen(raw.id),
    };
  }
}
function cjk(l) { return l === 'ja' || l === 'zh'; }
</script>
</body>
</html>
